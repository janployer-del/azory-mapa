    const TEMA_EMOJI = { "Turistika":"🥾","Koupání":"🏊","Příroda":"🌿","Atmosféra":"🌅","Jídlo":"🍽","Praktické":"🔧","Atrakce":"🏛","Ubytování":"🛏","Informace":"ℹ️" };
    const pinColor = p => p.type === "Ubytování" ? TEMA_COLOR["Ubytování"] : (TEMA_COLOR[p.theme] || "#6a6a7a");
    const pinEmoji = p => p.type === "Ubytování" ? "🛏" : (TEMA_EMOJI[p.theme] || "📍");
    const small = Math.min(window.innerWidth, window.innerHeight) < 560;

    points.forEach(point => {
      const isUbyt = point.type === "Ubytování";
      const sz = isUbyt ? (small ? 32 : 38) : (small ? 28 : 32);
      const fs2 = Math.round(sz / 2);
      const detail = pointDetail(point);
      const desc = (detail && detail.shortDescription) ? detail.shortDescription : (point.subtitle || "");
      const img = detail && detail.primaryImage ? detail.primaryImage : "";
      const themeLabel = isUbyt ? "Ubytování" : (point.theme || "Místo");
      const html = `
        <div class="popup-card">
          ${img ? `<div class="popup-img"><img src="${escapeHtml(img)}" alt="${escapeHtml(point.name)}" loading="lazy"></div>` : ""}
          <div class="popup-title">${escapeHtml(point.name)}</div>
          ${desc ? `<div class="popup-desc">${escapeHtml(desc)}</div>` : ""}
          <div class="popup-tags"><span class="tag">${escapeHtml(themeLabel)}</span></div>
          ${point.mapyUrl ? `<a class="popup-link" href="${escapeHtml(point.mapyUrl)}" target="_blank" rel="noopener">🗺 Mapy.cz</a>` : ""}
        </div>`;
      const icon = L.divIcon({
        className: "atlas-marker",
        html: `<div style="width:${sz}px;height:${sz}px;background:${pinColor(point)};border:2.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.45);font-size:${fs2}px;line-height:1">${pinEmoji(point)}</div>`,
        iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2], popupAnchor: [0, -Math.round(sz / 2)]
      });
      L.marker([point.coordinates.lat, point.coordinates.lng], { icon, zIndexOffset: isUbyt ? 500 : 0 }).addTo(map).bindPopup(html, { maxWidth: 280, minWidth: 200 });
    });
  </script>
</body>
</html>
