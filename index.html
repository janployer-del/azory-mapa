{"name":"Caldeira Velha","subtitle":"termální bazény s vodopádem","rawCoordinates":"37.7822208N, 25.5004378W","type":"Aktivita","theme":"Koupání","phase":"4. 2.8.–4.8. Furnas","visitDate":"2026-08-02","visitEnd":"","reserveBy":"2026-06-30","cislo":122,"mapyUrl":"https://mapy.com/s/kosupafovo","notionUrl":"https://app.notion.com/p/Caldeira-Velha-term-ln-baz-ny-s-vodop-dem-345351be095e8151a350d8cc7e7ee657"}
    ]
    const mapDetails = window.MAP_DETAILS || {};
    function parseCoordinates(value) {
      if (!value) return null;
      const matches = [...value.replace(/\*/g, "").matchAll(/(-?\d+(?:\.\d+)?)\s*([NSEW])?/gi)];
      if (matches.length < 2) return null;
      let lat = Number(matches[0][1]); let lng = Number(matches[1][1]);
      const a = (matches[0][2]||"").toUpperCase(); const b = (matches[1][2]||"").toUpperCase();
      if (a === "S") lat = -Math.abs(lat); if (a === "N") lat = Math.abs(lat);
      if (b === "W") lng = -Math.abs(lng); if (b === "E") lng = Math.abs(lng);
      if (Math.abs(lat) > 90 && Math.abs(lng) <= 90) [lat, lng] = [lng, lat];
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
      return { lat, lng };
    }
    function escapeHtml(v) { return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function pointDetail(p) { return mapDetails[p.notionUrl] || null; }
    const TEMA_COLOR = { "Turistika":"#4a7c59","Koupání":"#2e86ab","Příroda":"#6b9e6b","Atmosféra":"#c17f4a","Jídlo":"#b85c38","Praktické":"#6a6a7a","Atrakce":"#7a5a9a","Ubytování":"#8b6f47","Informace":"#4a6a7a" };
    const TEMA_EMOJI = { "Turistika":"🥾","Koupání":"🏊","Příroda":"🌿","Atmosféra":"🌅","Jídlo":"🍽","Praktické":"🔧","Atrakce":"🏛","Ubytování":"🛏","Informace":"ℹ️" };
    const pinColor = p => p.type === "Ubytování" ? TEMA_COLOR["Ubytování"] : (TEMA_COLOR[p.theme] || "#6a6a7a");
    const pinEmoji = p => p.type === "Ubytování" ? "🛏" : (TEMA_EMOJI[p.theme] || "📍");

    const points = rawPoints.filter(p => p.type !== "Doprava").map(p => ({ ...p, coordinates: parseCoordinates(p.rawCoordinates) })).filter(p => p.coordinates);

    const map = L.map("map", { zoomControl: true }).setView([38.45, -28.05], 7);
    const baseLayers = {
      "Mapa (OpenStreetMap)": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, subdomains: "abc", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }),
      "Satelit": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Tiles &copy; Esri, Maxar" })
    };
    baseLayers["Mapa (OpenStreetMap)"].addTo(map);
    L.control.layers(baseLayers, null, { position: "topright", collapsed: true }).addTo(map);

    const small = Math.min(window.innerWidth, window.innerHeight) < 560;
    points.forEach(point => {
      const isUbyt = point.type === "Ubytování";
      const sz = isUbyt ? (small ? 32 : 38) : (small ? 28 : 32);
      const fs2 = Math.round(sz / 2);
      const detail = pointDetail(point);
      const desc = (detail && detail.shortDescription) ? detail.shortDescription : (point.subtitle || "");
      const img = detail && detail.primaryImage ? String(detail.primaryImage).split(",")[0].trim() : "";
      const themeLabel = isUbyt ? "Ubytování" : (point.theme || "Místo");
      const html = `<div class="popup-card">${img ? `<div class="popup-img"><img src="${escapeHtml(img)}" alt="${escapeHtml(point.name)}" loading="lazy" onerror="this.closest('.popup-img').style.display='none'"></div>` : ""}<div class="popup-title">${escapeHtml(point.name)}</div>${desc ? `<div class="popup-desc">${escapeHtml(desc)}</div>` : ""}<div class="popup-tags"><span class="tag">${escapeHtml(themeLabel)}</span></div>${point.mapyUrl ? `<a class="popup-link" href="${escapeHtml(point.mapyUrl)}" target="_blank" rel="noopener">🗺 Mapy.cz</a>` : ""}</div>`;
      const icon = L.divIcon({ className: "atlas-marker", html: `<div style="width:${sz}px;height:${sz}px;background:${pinColor(point)};border:2.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.45);font-size:${fs2}px;line-height:1">${pinEmoji(point)}</div>`, iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2], popupAnchor: [0, -Math.round(sz / 2)] });
      L.marker([point.coordinates.lat, point.coordinates.lng], { icon, zIndexOffset: isUbyt ? 500 : 0 }).addTo(map).bindPopup(html, { maxWidth: 280, minWidth: 200 });
    });
  </script>
